# [[secrets.*]] entry schema — each secret declaration

[meta]
version = "v1"

[fields.value_source]
type = "string"
required = true

[fields.targets]
type = "list<string>"
required = true
enum_items = ["compose", "file", "vault", "k8s"]

[fields.options]
type = "record"
required = false
default = {}

[fields.length]
type = "int"
required = false
min = 8
max = 4096

[fields.charset]
type = "string"
required = false
enum = ["alphanumeric", "base64", "hex", "symbols"]

[fields.tool]
type = "string"
required = false

[fields.key_bits]
type = "int"
required = false
enum = [2048, 3072, 4096]

[fields.format]
type = "string"
required = false
enum = ["pkcs1", "pkcs8"]
