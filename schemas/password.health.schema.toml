# password provider health checks
# Evaluated by schema.run-health-checks — generic engine, no custom handlers.

[[checks]]
name = "openssl_available"
type = "tool"
tool = "openssl"
severity = "error"

[[checks]]
name = "password_length_sane"
type = "config"
path = "providers.password.length"
min = 8
max = 4096
severity = "warn"

[[checks]]
name = "password_charset_valid"
type = "config"
path = "providers.password.charset"
enum = ["alphanumeric", "base64", "hex", "symbols"]
severity = "warn"
